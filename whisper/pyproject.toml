[project]
name = "whisper-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av<19",
    "faster-whisper>=1.2.1",
    "markdown>=3.11",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'linux'",
    "rapidocr>=3.9.2",
    "yt-dlp>=2026.9.27.232945.dev0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    # 린트·타입 검사 결과가 버전마다 달라지지 않게 고정한다 (두 기기와 ralph 검증 기준선을 같게)
    "pyright==1.1.408",
    "pytest>=9.1.1",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
